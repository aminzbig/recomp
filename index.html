if (!window.storage) {
  window.storage = {
    async get(key){ const v = localStorage.getItem("recomp:"+key); if(v===null) throw new Error("not found"); return { key, value: v }; },
    async set(key, value){ localStorage.setItem("recomp:"+key, value); return { key, value }; },
    async delete(key){ localStorage.removeItem("recomp:"+key); return { key, deleted:true }; },
    async list(prefix){ const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith("recomp:"+(prefix||""))) keys.push(k.slice(7)); } return { keys }; },
  };
}

}
